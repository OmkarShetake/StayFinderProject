server:
  port: ${PORT:8080}

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: stayfinder

  threads:
    virtual:
      enabled: true

  datasource:
    url:               ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stayfinder_db}
    username:          ${SPRING_DATASOURCE_USERNAME:postgres}
    password:          ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle:      5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled:             true
    locations:           classpath:db/migration
    validate-on-migrate: false

  web:
    resources:
      static-locations: classpath:/static/

  # ── Kafka ─────────────────────────────────────────────────────────
  kafka:
    enabled:           ${KAFKA_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer:   org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks:    all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id:           stayfinder-notification-group
      key-deserializer:   org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset:  earliest
      properties:
        spring.json.trusted.packages: "com.stayfinder.kafka"

  # ── Email (Gmail SMTP) ─────────────────────────────────────────────
  mail:
    host:     smtp.gmail.com
    port:     587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth:     true
          starttls:
            enable:   true
            required: true
        debug: false

# ── JWT ───────────────────────────────────────────────────────────────
jwt:
  secret:             ${JWT_SECRET}
  expiration:         86400000
  refresh-expiration: 604800000

# ── StayFinder ────────────────────────────────────────────────────────
stayfinder:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  service-fee-percent:  12
  cleaning-fee-default: 800
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    enabled:   ${MAIL_ENABLED:true}
    from:      ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME:StayFinder}

# ── Google Gemini AI ──────────────────────────────────────────────────
gemini:
  api:
    key:     ${GEMINI_API_KEY}
    enabled: ${GEMINI_ENABLED:true}

# ── Actuator ──────────────────────────────────────────────────────────
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

# ── SpringDoc / Swagger ───────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

# ── Logging ───────────────────────────────────────────────────────────
logging:
  level:
    com.stayfinder:               INFO
    org.springframework.security: WARN
    org.springframework.web.socket: WARN
    org.springframework.mail:     INFO
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr(%-5level){highlight} %clr(%logger{36}){cyan} %clr([%X{requestId}]){yellow} - %msg%n"
