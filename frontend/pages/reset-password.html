<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — StayFinder</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-logo" id="nav-logo">stayfinder</div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">stayfinder</div>
    <h2 class="auth-title">Set new password</h2>
    <p class="auth-subtitle">Enter your new password below.</p>

    <div id="invalid-token" class="hidden" style="text-align:center;padding:20px 0">
      <div style="font-size:48px;margin-bottom:12px">❌</div>
      <h3 style="margin-bottom:8px">Invalid or expired link</h3>
      <p style="color:var(--text-2);margin-bottom:20px">This reset link is invalid or has expired.</p>
      <a href="forgot-password.html" class="btn btn-primary">Request new link</a>
    </div>

    <div id="success-msg" class="hidden" style="text-align:center;padding:20px 0">
      <div style="font-size:48px;margin-bottom:12px">✅</div>
      <h3 style="margin-bottom:8px">Password reset!</h3>
      <p style="color:var(--text-2);margin-bottom:20px">Your password has been updated successfully.</p>
      <a href="../index.html" class="btn btn-primary">Log in now</a>
    </div>

    <div id="error-msg" class="auth-error hidden"></div>

    <form id="reset-form">
      <div class="form-group">
        <label class="form-label">New password</label>
        <input type="password" class="form-input" id="rp-password" placeholder="Min 8 characters" required minlength="8">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm new password</label>
        <input type="password" class="form-input" id="rp-confirm" placeholder="Repeat password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="rp-btn">Reset password</button>
    </form>
  </div>
</div>

<div id="toast"></div>

<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/reset-password.js"></script>
</body>
</html>
