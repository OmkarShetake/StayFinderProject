<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search — StayFinder</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#FF385C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StayFinder">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/search.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="nav-logo" id="nav-logo">stayfinder</div>

  <div class="nav-search" id="nav-search-bar" style="cursor:pointer">
    <div class="ns-pill">
      <div class="ns-label">Where</div>
      <div class="ns-value" id="ns-city">Anywhere</div>
    </div>
    <div class="ns-pill">
      <div class="ns-label">Check in</div>
      <div class="ns-value" id="ns-checkin">Add dates</div>
    </div>
    <div class="ns-pill">
      <div class="ns-label">Check out</div>
      <div class="ns-value" id="ns-checkout">Add dates</div>
    </div>
    <div class="ns-pill">
      <div class="ns-label">Guests</div>
      <div class="ns-value" id="ns-guests">Add guests</div>
    </div>
    <button class="ns-btn" id="ns-search-btn">
      <svg viewBox="0 0 14 14"><circle cx="6" cy="6" r="4"/><line x1="9.5" y1="9.5" x2="12.5" y2="12.5"/></svg>
    </button>
  </div>

  <div class="nav-right">
    <button class="nav-link hidden" id="nav-login-btn">Log in</button>
    <div class="nav-user" id="nav-user-btn" style="position:relative">
      <div class="nav-ham">☰</div>
      <div class="nav-avatar" id="nav-avatar">👤</div>
      <div class="notif-dot hidden"></div>
      <div class="nav-dropdown" id="nav-dropdown">
        <div class="nav-dropdown-user hidden" id="nav-dropdown-user">
          <div class="nav-dropdown-avatar" id="nav-dropdown-avatar"></div>
          <div>
            <div class="nav-dropdown-name" id="nav-dropdown-name"></div>
            <div class="nav-dropdown-email" id="nav-dropdown-email"></div>
          </div>
        </div>
        <div class="nav-dropdown-section" id="nav-dropdown-guest">
          <button class="nav-dropdown-item" id="nav-dropdown-login">
            <span class="nav-dropdown-item-icon">🔑</span> Log in
          </button>
          <button class="nav-dropdown-item" id="nav-dropdown-signup">
            <span class="nav-dropdown-item-icon">✨</span> Sign up
          </button>
        </div>
        <div class="nav-dropdown-section hidden" id="nav-dropdown-auth">
          <button class="nav-dropdown-item" id="nav-dropdown-trips">
            <span class="nav-dropdown-item-icon">🧳</span> My trips
          </button>
          <button class="nav-dropdown-item" id="nav-dropdown-wishlist">
            <span class="nav-dropdown-item-icon">❤️</span> Wishlists
          </button>
          <button class="nav-dropdown-item" id="nav-dropdown-host-link">
            <span class="nav-dropdown-item-icon">🏠</span> Host dashboard
          </button>
          <button class="nav-dropdown-item hidden" id="nav-dropdown-admin">
            <span class="nav-dropdown-item-icon">⚙️</span> Admin Panel
          </button>
        </div>
        <div class="hidden" id="nav-dropdown-logout-wrap">
          <button class="nav-dropdown-logout" id="nav-logout">
            <span class="nav-dropdown-logout-icon">👋</span> Log out
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Main Layout -->
<div class="search-layout">

  <!-- Filter Sidebar -->
  <aside class="filter-sidebar">
    <h3>
      Filters
      <button class="filter-clear" onclick="SearchPage.clearFilters()">Clear all</button>
    </h3>

    <div class="filter-section">
      <label class="filter-label">Location</label>
      <div style="position:relative">
        <input type="text" class="filter-input" id="f-city" placeholder="City, state, country..." autocomplete="off">
        <div class="city-suggestions hidden" id="f-city-suggestions"></div>
      </div>
    </div>

    <div class="filter-section">
      <label class="filter-label">Check in</label>
      <input type="date" class="filter-input" id="f-checkin" style="margin-bottom:8px">
      <label class="filter-label">Check out</label>
      <input type="date" class="filter-input" id="f-checkout">
    </div>

    <div class="filter-section">
      <label class="filter-label">Guests</label>
      <input type="number" class="filter-input" id="f-guests" min="1" max="16" placeholder="1">
    </div>

    <div class="filter-section">
      <label class="filter-label">Price per night (₹)</label>
      <div class="filter-price-row">
        <input type="number" class="filter-input" id="f-min-price" placeholder="Min" min="0">
        <input type="number" class="filter-input" id="f-max-price" placeholder="Max" min="0">
      </div>
    </div>

    <div class="filter-section">
      <label class="filter-label">Property type</label>
      <div class="filter-type-grid">
        <button class="filter-type-btn active" data-type="" onclick="SearchPage.selectType('', this)">🏘 Any type</button>
        <button class="filter-type-btn" data-type="ENTIRE_HOME" onclick="SearchPage.selectType('ENTIRE_HOME', this)">🏠 Entire home</button>
        <button class="filter-type-btn" data-type="PRIVATE_ROOM" onclick="SearchPage.selectType('PRIVATE_ROOM', this)">🛏 Private room</button>
        <button class="filter-type-btn" data-type="SHARED_ROOM" onclick="SearchPage.selectType('SHARED_ROOM', this)">🛋 Shared room</button>
      </div>
    </div>

    <div class="filter-section">
      <label class="filter-label">Category</label>
      <div class="filter-category-grid">
        <button class="filter-cat-btn active" data-cat="" onclick="SearchPage.selectCategory('', this)"><span class="filter-cat-icon">🏠</span> All</button>
        <button class="filter-cat-btn" data-cat="BEACH" onclick="SearchPage.selectCategory('BEACH', this)"><span class="filter-cat-icon">🏖</span> Beach</button>
        <button class="filter-cat-btn" data-cat="MOUNTAIN" onclick="SearchPage.selectCategory('MOUNTAIN', this)"><span class="filter-cat-icon">🏔</span> Mountain</button>
        <button class="filter-cat-btn" data-cat="CITY" onclick="SearchPage.selectCategory('CITY', this)"><span class="filter-cat-icon">🏙</span> City</button>
        <button class="filter-cat-btn" data-cat="COUNTRYSIDE" onclick="SearchPage.selectCategory('COUNTRYSIDE', this)"><span class="filter-cat-icon">🌿</span> Countryside</button>
        <button class="filter-cat-btn" data-cat="LAKEFRONT" onclick="SearchPage.selectCategory('LAKEFRONT', this)"><span class="filter-cat-icon">🌊</span> Lakefront</button>
        <button class="filter-cat-btn" data-cat="UNIQUE" onclick="SearchPage.selectCategory('UNIQUE', this)"><span class="filter-cat-icon">🛖</span> Unique</button>
        <button class="filter-cat-btn" data-cat="HERITAGE" onclick="SearchPage.selectCategory('HERITAGE', this)"><span class="filter-cat-icon">🏰</span> Heritage</button>
        <button class="filter-cat-btn" data-cat="CAMPING" onclick="SearchPage.selectCategory('CAMPING', this)"><span class="filter-cat-icon">🏕</span> Camping</button>
      </div>
    </div>

    <button class="filter-apply-btn" onclick="SearchPage.applyFilters()">Search properties</button>
  </aside>

  <!-- Results -->
  <div>
    <div class="results-header">
      <div class="results-count" id="results-count">Loading...</div>
      <div style="display:flex;align-items:center;gap:12px">
        <div class="view-toggle">
          <button class="view-toggle-btn active" id="btn-grid-view" title="Grid view">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          </button>
          <button class="view-toggle-btn" id="btn-map-view" title="Map view">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
          </button>
        </div>
        <div class="results-sort">
          Sort by
          <select id="sort-select" onchange="SearchPage.applyFilters()">
            <option value="">Recommended</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="rating">Top Rated</option>
          </select>
        </div>
      </div>
    </div>

    <!-- AI Recommendations Banner -->
    <div id="ai-recommendations-banner" class="ai-recommendations-banner hidden">
      <div class="ai-rec-icon">✨</div>
      <div class="ai-rec-content">
        <div class="ai-rec-title">Personalized for you</div>
        <div class="ai-rec-text" id="ai-rec-text">Loading recommendations...</div>
      </div>
      <button class="ai-rec-close" onclick="SearchPage.closeRecommendations()">✕</button>
    </div>

    <!-- Natural Language Search -->
    <div class="nl-search-container">
      <div class="nl-search-box">
        <input type="text" id="nl-search-input" class="nl-search-input"
               placeholder="Try: 'romantic beachfront villa for honeymoon' or 'family home in Mumbai with pool'"/>
        <button class="nl-search-btn" id="nl-search-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          Search
        </button>
      </div>
      <div class="nl-search-hint">💡 Describe what you're looking for in your own words</div>
    </div>

    <!-- Grid view -->
    <div class="prop-grid" id="results-grid" style="padding:0"></div>

    <!-- Map view -->
    <div id="map-view" style="display:none;height:600px;border-radius:12px;overflow:hidden;margin-bottom:24px"></div>

    <div class="pagination" id="pagination"></div>
  </div>

</div>

<!-- Search Modal -->
<div class="modal-overlay hidden" id="search-modal">
  <div class="modal">
    <button class="modal-close" onclick="Utils.hideModal('search-modal')">✕</button>
    <h3 style="margin-bottom:20px">Edit search</h3>
    <div class="form-group">
      <label class="form-label">Where</label>
      <input type="text" class="form-input" id="sm-city" placeholder="Mumbai, Goa, Manali...">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group">
        <label class="form-label">Check in</label>
        <input type="date" class="form-input" id="sm-checkin">
      </div>
      <div class="form-group">
        <label class="form-label">Check out</label>
        <input type="date" class="form-input" id="sm-checkout">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Guests</label>
      <input type="number" class="form-input" id="sm-guests" min="1" max="16" placeholder="1">
    </div>
    <button class="btn btn-primary btn-full" id="search-modal-btn">Search</button>
  </div>
</div>

<!-- Auth Modal -->
<div class="modal-overlay hidden" id="auth-modal">
  <div class="modal auth-modal">
    <button class="modal-close" onclick="Utils.hideModal('auth-modal')">✕</button>
    <h3 id="auth-modal-title" style="text-align:center;margin-bottom:20px">Log in to StayFinder</h3>
    <div class="auth-modal-tabs">
      <div class="auth-modal-tab active" id="auth-tab-login">Log in</div>
      <div class="auth-modal-tab" id="auth-tab-register">Sign up</div>
    </div>
    <form id="login-form">
      <div class="auth-error hidden" id="login-error"></div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="login-email" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="login-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="login-submit">Log in</button>
    </form>
    <form id="register-form" class="hidden">
      <div class="auth-error hidden" id="reg-error"></div>
      <div class="form-group">
        <label class="form-label">Full name</label>
        <input type="text" class="form-input" id="reg-name" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="reg-email" required>
      </div>
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input type="tel" class="form-input" id="reg-phone">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="reg-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="register-submit">Sign up</button>
    </form>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/websocket.js"></script>
<script src="../js/search-page.js"></script>
</body>
</html>
